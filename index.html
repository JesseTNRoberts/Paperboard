<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E %3Crect width='512' height='512' rx='112' fill='#1f4f67'/%3E %3Crect x='64' y='72' width='120' height='368' rx='10' fill='#ffffff' opacity='.07'/%3E %3Crect x='328' y='72' width='120' height='368' rx='10' fill='#ffffff' opacity='.07'/%3E %3Crect x='76' y='132' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Crect x='76' y='296' width='96' height='66' rx='9' fill='#fbfcfc' opacity='.55'/%3E %3Crect x='208' y='218' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Crect x='340' y='150' width='96' height='66' rx='9' fill='#fbfcfc' opacity='.55'/%3E %3Crect x='340' y='318' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Cpath d='M124 165 C 190 165, 196 251, 256 251 S 330 351, 380 351' fill='none' stroke='#e8a92a' stroke-width='22' stroke-linecap='round'/%3E %3Ccircle cx='124' cy='165' r='20' fill='#e8a92a'/%3E %3Cpath d='M372 318 L 420 351 L 372 384 Z' fill='#e8a92a'/%3E %3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* An infinite board. Sections are vertical bands with draggable boundaries, streams are horizontal lanes, beats are cards with tag tabs. */
:root {
  --board:#eef1f0; --dot:#cdd5d3; --ink:#1d2a2e; --ink-soft:#5b6a6e; --card:#ffffff; --edge:#cbd4d2; --panel:#fbfcfc;
  --accent:#2b6e8f; --band:rgba(43,110,143,.045); --danger:#b02a4a; --select:#e0a21b; --changed:#2f9e5b;
  --note-y:#f5e6a0; --note-b:#cfe5ee; --note-p:#f3d2cc; --note-ink:#2c2a1e;
  --display:"Newsreader", Georgia, serif; --ui:"IBM Plex Sans", system-ui, -apple-system, sans-serif; --marker:"Kalam","Marker Felt","Comic Sans MS",cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --board:#1a1f22; --dot:#2d3539; --ink:#e4ebe9; --ink-soft:#97a6a4; --card:#242b2f; --edge:#3a4549; --panel:#20272a;
  --accent:#6fb0d0; --band:rgba(111,176,208,.06); --danger:#e57a91; --select:#f0bf4c; --changed:#5fd38e;
  --note-y:#5b5330; --note-b:#2f4a55; --note-p:#5a3934; --note-ink:#f1ecd9; color-scheme: dark; } }
html, body { height:100%; margin:0; }
body { background:var(--board); color:var(--ink); font:14px/1.4 var(--ui); overflow:hidden; }
button, input, select, textarea { font:inherit; color:inherit; }
[hidden] { display:none !important; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

#viewport { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size:24px 24px; }
#viewport.panning { cursor:grabbing; }
#viewport.inserting { cursor:col-resize; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
.band { position:absolute; top:0; }
.band.odd { background:var(--band); }
.divider { position:absolute; top:0; width:18px; margin-left:-9px; cursor:ew-resize; z-index:2; }
.divider::after { content:""; position:absolute; left:8px; top:0; bottom:0; border-left:2px dashed var(--edge); }
.divider:hover::after, .divider.dragging::after { border-left:3px solid var(--accent); }
.lane { position:absolute; left:0; height:0; border-top:1px solid var(--edge); }
#marquee { position:absolute; border:1.5px dashed var(--accent); background:var(--band); pointer-events:none; z-index:7; }
#guide { position:absolute; top:0; width:0; border-left:3px solid var(--select); pointer-events:none; z-index:6; }

svg#links { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
svg#links path { fill:none; stroke:var(--ink-soft); stroke-width:2.5; pointer-events:stroke; cursor:pointer; }
svg#links path.hit { stroke:transparent; stroke-width:16; }
svg#links g.sel path:not(.hit) { stroke:var(--select); stroke-width:3.5; }
svg#links text { fill:var(--ink); font:600 17px var(--ui); paint-order:stroke; stroke:var(--board); stroke-width:5px; }
svg#links marker path { fill:var(--ink-soft); stroke:none; }

/* cards */
.card { position:absolute; width:230px; height:150px; box-sizing:border-box; padding:10px 14px 10px 14px; background:var(--card);
  border:2px solid var(--edge); border-radius:4px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.04); }
.card .ci { display:flex; flex-direction:column; gap:5px; height:100%; overflow:hidden; }
.card .ty { display:flex; align-items:center; gap:6px; font:600 calc(10.5px * var(--ts, 1))/1 var(--ui); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); min-height:14px; }
.card .ty svg { width:calc(14px * var(--ts, 1)); height:calc(14px * var(--ts, 1)); flex:none; }
.card .ty .st { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card h3 { margin:0; font:600 calc(18px * var(--ts, 1))/1.15 var(--display); text-wrap:balance; overflow-wrap:anywhere; }
.card p { margin:0; font:400 calc(12.5px * var(--ts, 1))/1.4 var(--ui); color:var(--ink-soft); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.card.dragging { box-shadow:0 10px 28px rgba(0,0,0,.18); z-index:5; cursor:grabbing; }
.card.picked, .card.active { outline:3px solid var(--select); outline-offset:2px; }
.card.selected, .note.selected { outline:3px solid var(--accent); outline-offset:2px; }
.tabs { position:absolute; left:10px; right:6px; top:100%; display:flex; gap:3px; flex-wrap:nowrap; overflow:hidden; pointer-events:none; }
.tab { font:600 calc(11px * var(--ts, 1))/1 var(--ui); letter-spacing:.03em; padding:2px 6px 3px; border-radius:0 0 4px 4px; white-space:nowrap; flex:none; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
.tab.adjtab { background:var(--select); color:#1d2a2e; }
/* zoomed far out, titles grow (--zf) so the whole document stays readable */
#world[data-zoom="far"] .tab { font-size:calc(9px * var(--ts, 1) * var(--zf, 1)); padding:3px 8px 5px; max-width:none; }
#world[data-zoom="far"] .card .ci { justify-content:center; }
#world[data-zoom="far"] .card h3 { font-size:calc(15px * var(--ts, 1) * var(--zf, 1)); line-height:1.08; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word; hyphens:auto; }
#world[data-zoom="far"] .card p, #world[data-zoom="mid"] .card p, #world[data-zoom="far"] .card .ty { display:none; }
.card.changed { box-shadow:0 0 0 4px var(--changed), 0 6px 18px rgba(0,0,0,.12); }
.card.changed::before { content:"Updated"; position:absolute; top:-11px; right:10px; z-index:1; background:var(--changed); color:#fff;
  font:600 calc(10px * var(--ts, 1))/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; padding:3px 6px 4px; border-radius:3px; }
#world[data-zoom="far"] .card.changed::before, #world[data-zoom="far"] .card.conflict::before { font-size:calc(8px * var(--zf, 1)); top:calc(-9px * var(--zf, 1)); padding:4px 8px 5px; }
.card.conflict { box-shadow:0 0 0 4px var(--danger), 0 6px 18px rgba(0,0,0,.12); }
.card.conflict::before { content:"Needs your choice"; position:absolute; top:-11px; right:10px; z-index:1; background:var(--danger); color:#fff;
  font:600 calc(10px * var(--ts, 1))/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; padding:3px 6px 4px; border-radius:3px; }
.card.flash { animation:flash 1.8s ease-out 1; }
@keyframes flash { 0% { box-shadow:0 0 0 18px var(--changed); } 100% { box-shadow:0 0 0 4px var(--changed), 0 6px 18px rgba(0,0,0,.12); } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation:none; } }

/* sticky notes */
.note { position:absolute; width:200px; min-height:140px; background:var(--note-y); color:var(--note-ink); box-shadow:0 2px 6px rgba(0,0,0,.12); transform:rotate(-1deg); display:flex; flex-direction:column; }
.note.b { background:var(--note-b); } .note.p { background:var(--note-p); }
.note .grip { height:22px; cursor:move; display:flex; justify-content:flex-end; align-items:center; gap:2px; padding:0 4px; }
.note .grip button { border:0; background:transparent; cursor:pointer; font-size:13px; padding:2px 5px; border-radius:2px; color:var(--note-ink); opacity:.7; }
.note .grip button:hover { opacity:1; background:rgba(0,0,0,.08); }
.note .grip button.armed { opacity:1; background:var(--danger); color:#fff; }
.note textarea { flex:1; min-height:110px; border:0; background:transparent; resize:none; padding:2px 12px 12px; font:400 19px/1.25 var(--marker); color:var(--note-ink); outline:none; }
.note.picked { outline:3px solid var(--select); outline-offset:3px; }

/* chrome */
.chrome { position:fixed; z-index:20; background:var(--panel); border:1px solid var(--edge); border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
#bar { top:12px; left:12px; display:flex; align-items:center; gap:4px; padding:6px; flex-wrap:wrap; max-width:calc(100% - 24px); box-sizing:border-box; }
#bar .logo { display:flex; padding-left:4px; }
#gate .logo { margin-bottom:12px; }
#bar .name { font:600 19px/1 var(--display); padding:0 10px 0 6px; color:var(--accent); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#bar .sep { width:1px; align-self:stretch; background:var(--edge); margin:2px 4px; }
#bar button, .btn { border:1px solid transparent; background:transparent; padding:6px 9px; border-radius:4px; cursor:pointer; font-size:13px; white-space:nowrap; }
#bar button:hover, .btn:hover { background:var(--band); border-color:var(--edge); }
#bar button.on, #bar button.primary { background:var(--accent); color:var(--panel); }
#bar button#clearhl { border-color:var(--changed); color:var(--changed); }
#bar button#clearhl:hover { background:var(--changed); color:#fff; }
#bar button#conflictsbtn { border-color:var(--danger); color:var(--danger); }
#zoomlbl { font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-soft); min-width:38px; text-align:center; }
#status { font-size:12px; color:var(--ink-soft); padding:0 8px; white-space:nowrap; max-width:340px; overflow:hidden; text-overflow:ellipsis; }
#status.err { color:var(--danger); }
#hint { bottom:56px; left:50%; transform:translateX(-50%); padding:8px 14px; font-size:13px; max-width:calc(100% - 40px); box-sizing:border-box; }

#colhdr { position:fixed; left:0; right:0; height:64px; z-index:11; overflow:hidden; background:var(--board); border-bottom:1px solid var(--edge); box-shadow:0 2px 6px rgba(0,0,0,.05); pointer-events:none; }
#rowhdr { position:fixed; left:0; bottom:0; width:150px; z-index:10; overflow:hidden; background:var(--board); border-right:1px solid var(--edge); box-shadow:2px 0 6px rgba(0,0,0,.05); pointer-events:none; }
#colhdr .cl { position:absolute; top:9px; white-space:nowrap; pointer-events:auto; cursor:pointer; }
#colhdr .cl b { display:block; font:600 22px/1.1 var(--display); color:var(--accent); }
#colhdr .cl small { display:block; margin-top:3px; font:500 12px/1 var(--ui); color:var(--ink-soft); font-variant-numeric:tabular-nums; }
#rowhdr .rl { position:absolute; left:14px; right:8px; font:600 14px/1.2 var(--ui); color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#rowhdr .rl i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:0; }

#legend { bottom:10px; left:162px; right:12px; padding:6px 12px; font-size:12px; display:flex; gap:6px 16px; overflow-x:auto; scrollbar-width:none; }
#legend .row { display:flex; align-items:center; gap:6px; color:var(--ink-soft); white-space:nowrap; flex:none; }
#legend i { width:14px; height:10px; display:inline-block; border-radius:1px; }

/* right-click menu */
#ctx { position:fixed; z-index:35; min-width:220px; max-width:340px; padding:6px; background:var(--panel); border:1px solid var(--edge); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.16); font-size:13px; }
#ctx .h { font:600 11px var(--ui); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); padding:6px 10px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#ctx button.it { display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 10px; border-radius:4px; cursor:pointer; }
#ctx button.it:hover, #ctx button.it:focus-visible { background:var(--band); outline:none; }
#ctx button.it.danger { color:var(--danger); }
#ctx button.it.danger.armed { background:var(--danger); color:#fff; }
#ctx .row { display:flex; align-items:center; gap:4px; padding:4px 10px; flex-wrap:wrap; }
#ctx .row span { color:var(--ink-soft); margin-right:4px; }
#ctx .row button { border:1px solid var(--edge); background:transparent; border-radius:3px; padding:3px 8px; cursor:pointer; }
#ctx .row button:hover { border-color:var(--accent); }
#ctx hr { border:0; border-top:1px solid var(--edge); margin:5px 2px; }
.tagpick { display:flex; flex-wrap:wrap; gap:5px; }
.tagpick button, #ctx .tg { border:1px solid var(--tc); color:var(--tc); background:transparent; border-radius:3px; padding:3px 8px; font-size:12px; cursor:pointer; }
.tagpick button.on, #ctx .tg.on { background:var(--tc); color:var(--tcf); }
#ctx .tg.some { background:linear-gradient(90deg, var(--tc) 50%, transparent 50%); }

/* panels */
.panel { top:86px; right:12px; width:min(420px, calc(100% - 24px)); max-height:calc(100% - 140px); overflow:auto; padding:18px 20px; box-sizing:border-box; }
.panel header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.panel .eyebrow { font:600 11px var(--ui); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
.panel h2 { margin:4px 0 0; font:600 22px/1.15 var(--display); }
.panel .x { border:0; background:transparent; cursor:pointer; font-size:20px; color:var(--ink-soft); padding:0 4px; }
.panel label, .panel .lbl { display:block; font:600 11px var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 4px; }
.panel input[type=text], .panel input[type=number], .panel select, .panel textarea { width:100%; box-sizing:border-box; border:1px solid var(--edge); background:var(--card); border-radius:4px; padding:7px 9px; }
.panel input.title { font:600 20px/1.2 var(--display); }
.panel textarea { min-height:240px; resize:vertical; line-height:1.5; }
.panel .btnrow { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.panel .btnrow button, .panel .mini { border:1px solid var(--edge); background:transparent; border-radius:4px; padding:5px 9px; cursor:pointer; font-size:13px; }
.panel .btnrow button:hover, .panel .mini:hover { border-color:var(--accent); }
.panel button.danger { border-color:var(--danger); color:var(--danger); }
.panel button.danger.armed { background:var(--danger); color:#fff; }
.panel button.primary { background:var(--accent); border-color:var(--accent); color:var(--panel); }
.panel .help { font-size:12.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.5; }
.panel h3 { margin:18px 0 6px; font:600 15px var(--display); }
.panel h3 small { font:500 12px var(--ui); color:var(--ink-soft); margin-left:6px; font-variant-numeric:tabular-nums; }
.panel ol { margin:8px 0 0; padding-left:22px; font-size:13px; }
.panel ol li { margin:2px 0; }
.panel ol li small { color:var(--ink-soft); font-size:12px; margin-left:4px; }
.panel ol li button { border:0; background:none; padding:0; cursor:pointer; color:inherit; text-align:left; font:inherit; }
.panel ol li button:hover { color:var(--accent); text-decoration:underline; }
.rowedit { display:flex; gap:6px; align-items:center; margin:5px 0; }
.rowedit input[type=text] { flex:1; min-width:0; padding:5px 7px; }
.rowedit input[type=color] { width:30px; height:28px; padding:0; border:1px solid var(--edge); border-radius:4px; background:none; flex:none; }
.rowedit .mini { padding:4px 7px; flex:none; }

/* beat editor */
.panel.editor { display:flex; flex-direction:column; }
.panel.editor.half { right:0; bottom:0; width:50vw; max-height:none; border-radius:0; border-width:0 0 0 1px; }
.panel.editor.full { inset:0 !important; width:auto; max-height:none; border-radius:0; border:0; z-index:30; padding:22px max(24px, calc((100vw - 860px) / 2)); }
@media (max-width:700px) { .panel.editor.half { width:100vw; } }
.sizes { display:flex; gap:2px; border:1px solid var(--edge); border-radius:5px; padding:2px; }
.sizes button { border:0; background:transparent; border-radius:3px; padding:3px 8px; font-size:12px; cursor:pointer; color:var(--ink-soft); }
.sizes button.on { background:var(--accent); color:var(--panel); }
.hdrright { display:flex; gap:8px; align-items:center; }
.meta3 { display:flex; gap:10px; }
.meta3 > div { flex:1; min-width:0; }
.meta3 > div.ty { flex:0 0 160px; }
.etabs { display:flex; gap:2px; margin-top:16px; border-bottom:1px solid var(--edge); flex-wrap:wrap; }
.etabs button { border:1px solid transparent; border-bottom:0; background:transparent; padding:7px 13px; border-radius:5px 5px 0 0; cursor:pointer; font-size:13px; color:var(--ink-soft); margin-bottom:-1px; }
.etabs button:hover { color:var(--ink); background:var(--band); }
.etabs button.on { background:var(--card); border-color:var(--edge); color:var(--ink); font-weight:600; }
.etabs button[data-tab="adj"].on { background:color-mix(in srgb, var(--select) 12%, var(--card)); }
.etabs .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--select); margin-left:6px; vertical-align:1px; }
.pane { display:flex; flex-direction:column; flex:1; min-height:0; }
.mdbar { display:flex; gap:2px; align-items:center; flex-wrap:wrap; padding:4px; border:1px solid var(--edge); border-top:0; border-bottom:0; background:var(--card); }
.mdbar button { border:0; background:transparent; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:13px; min-width:28px; }
.mdbar button:hover { background:var(--band); }
.mdbar button.on { background:var(--band); color:var(--accent); font-weight:600; }
.mdbar .grow { flex:1; }
.mdbar .wc { font-size:12px; color:var(--ink-soft); padding:0 6px; font-variant-numeric:tabular-nums; }
.mdwrap { flex:1; min-height:260px; display:flex; border:1px solid var(--edge); border-top:0; border-radius:0 0 4px 4px; overflow:hidden; background:var(--card); }
.pane[data-pane="beat"] .mdwrap { border-top:1px solid var(--edge); border-radius:0 0 4px 4px; }
.panel.editor:not(.half):not(.full) .mdwrap { flex:none; height:300px; }
.panel textarea.md { flex:1; min-width:0; border:0; border-radius:0; min-height:0; height:auto; resize:none; padding:14px 16px; font:400 17px/1.65 var(--display); background:var(--card); }
.panel textarea.md:focus-visible { outline:none; }
.mdprev { flex:1; min-width:0; overflow:auto; padding:10px 18px; font:400 17px/1.65 var(--display); border-left:1px solid var(--edge); overflow-wrap:anywhere; }
.mdprev h1, .mdprev h2, .mdprev h3 { font-family:var(--display); line-height:1.2; margin:.8em 0 .4em; }
.mdprev blockquote { margin:.6em 0; padding-left:14px; border-left:3px solid var(--edge); color:var(--ink-soft); }
.mdprev p { margin:.6em 0; }
.mdprev code { font:13px ui-monospace, Menlo, monospace; background:var(--band); padding:1px 4px; border-radius:3px; }
.mdprev pre code { display:block; padding:8px 10px; overflow:auto; }
.mdprev img { max-width:100%; }
.mdwrap[data-view="write"] .mdprev, .mdwrap[data-view="preview"] textarea.md { display:none; }
.mdwrap[data-view="preview"] .mdprev { border-left:0; }
.mdwrap.adjwrap, .mdwrap.adjwrap textarea.md { background:color-mix(in srgb, var(--select) 7%, var(--card)); }
.panel.editor.full .mdwrap { border-color:transparent; }
.panel.editor .foot { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
.panel.editor .foot .help { margin:0; flex:1; }
.panel.editor .foot button { border:1px solid var(--edge); background:transparent; border-radius:4px; padding:5px 9px; cursor:pointer; font-size:13px; }

/* conflicts */
.panel.conflictp { width:min(1000px, calc(100% - 24px)); }
.conflictp .cols { display:flex; gap:12px; margin-top:6px; }
.conflictp .cols > div { flex:1; min-width:0; }
.conflictp pre { margin:0; white-space:pre-wrap; word-break:break-word; max-height:240px; overflow:auto; border:1px solid var(--edge); border-radius:4px; padding:8px 10px; background:var(--card); font:12.5px/1.45 ui-monospace, Menlo, monospace; }
.conflictp pre mark { background:color-mix(in srgb, var(--select) 35%, transparent); color:inherit; }
.conflictp textarea { min-height:240px; font:12.5px/1.5 ui-monospace, Menlo, monospace; }
@media (max-width:700px) { .conflictp .cols { flex-direction:column; } }

/* the opening screen */
#gate { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:var(--board); overflow:auto; padding:16px; box-sizing:border-box; }

<script id="core">
/* ================= core: beat files, merging, cursor mapping =================
   Pure functions with no DOM or file access, so they can be tested on their own.

   A beat file:
     ID: b-7f3k2a
     Type: Experiment
     Status: running
     Synopsis: one or two sentences

     Claude adjust:

     instructions to Claude (usually absent)

     ---

     the beat body

     === Notes ===

     notes

   Parsing records where each part sits in the file. Changing one part splices only that part's text,
   so an unedited file rebuilds byte for byte and editing one tab changes nothing else. */
const NOTES_MARK = "=== Notes ===";
const BEAT_TYPES = ["Paragraph", "Figure", "Table", "Experiment", "References", "Hypothesis", "Aim", "Note"];
const isDivider = l => /^---[ \t\r]*$/.test(l);
const isNotesMark = l => l.replace(/[ \t\r]+$/, "") === NOTES_MARK;

function scanLines(t) {   // [{s, e, nl}]: line start, end (before the newline), start of the next line
  const L = []; let s = 0;
  for (;;) { const e = t.indexOf("\n", s); if (e < 0) { L.push({ s, e: t.length, nl: t.length }); break; } L.push({ s, e, nl: e + 1 }); s = e + 1; }
  return L;
}
function section(t, a, b, inline) {   // a part of the file: [a,b) is its whole region, [cs,ce) the text itself without surrounding blank space
  const r = t.slice(a, b);
  const p = inline ? r.length - r.trimStart().length : r.match(/^(?:[ \t\r]*\n)*/)[0].length;
  const q = Math.max(p, r.trimEnd().length);
  return { a, b, cs: a + p, ce: a + q, value: t.slice(a + p, a + q) };
}
function parseBeat(t) {
  t = t ?? "";
  const L = scanLines(t), line = i => t.slice(L[i].s, L[i].e);
  const di = L.findIndex((_, i) => isDivider(line(i)));
  const P = { ok: di >= 0, fields: [], L };
  if (di < 0) { P.body = section(t, 0, t.length, false); P.syn = { missing: true, at: 0 }; P.adj = { missing: true, at: 0 }; P.notes = { missing: true }; return P; }
  let si = -1, ai = -1;
  for (let i = 0; i < di; i++) {
    const l = line(i);
    if (/^Claude adjust:/i.test(l)) { ai = i; break; }
    if (si < 0 && /^Synopsis:/i.test(l)) si = i;
  }
  const fieldEnd = si >= 0 ? si : ai >= 0 ? ai : di;
  for (let i = 0; i < fieldEnd; i++) {
    const m = line(i).match(/^([A-Za-z][A-Za-z0-9 _-]*?):([ \t]?)(.*?)(\r?)$/);
    if (m) P.fields.push({ key: m[1], line: i, colon: L[i].s + m[1].length + 1, vs: L[i].s + m[1].length + 1 + m[2].length, ve: L[i].e - m[4].length });
  }
  P.fieldInsert = L[fieldEnd].s;
  const synEnd = L[ai >= 0 ? ai : di].s;
  P.syn = si >= 0 ? section(t, L[si].s + 9, synEnd, true) : { missing: true, at: synEnd };
  P.adj = ai >= 0 ? section(t, L[ai].s + 14, L[di].s, true) : { missing: true, at: L[di].s };
  let ni = -1; for (let i = di + 1; i < L.length; i++) if (isNotesMark(line(i))) { ni = i; break; }
  P.body = section(t, L[di].nl, ni >= 0 ? L[ni].s : t.length, false);
  P.notes = ni >= 0 ? section(t, L[ni].nl, t.length, false) : { missing: true };
  return P;
}
/* everything the app needs from a beat, as plain values */
function beatParts(t) {
  const P = parseBeat(t), f = {};
  P.fields.forEach(x => { const k = x.key.toLowerCase(); if (!(k in f)) f[k] = t.slice(x.vs, x.ve).trim(); });
  const v = s => (s && !s.missing ? s.value : "");
  return { ok: P.ok, fields: f, id: f.id || "", type: normType(f.type), status: f.status || "",
    syn: v(P.syn), adj: v(P.adj), body: v(P.body), notes: v(P.notes) };
}
function normType(s) { const t = (s || "").trim().toLowerCase(); return BEAT_TYPES.find(x => x.toLowerCase() === t) || "Paragraph"; }
function cleanPart(part, v) {
  v = String(v ?? "").replace(/\r/g, "");
  if (part === "syn" || part === "adj") {
    v = v.replace(/^---[ \t]*$/gm, "– – –");   // a bare --- line would end the header early
    v = v.replace(/^(Claude adjust):/gim, "$1 –");
    v = v.replace(/^=== Notes ===[ \t]*$/gm, "\\=== Notes ===");
  }
  if (part === "body") v = v.replace(/^=== Notes ===[ \t]*$/gm, "\\=== Notes ===");   // would start the Notes early
  return v;
}
const spliceText = (t, a, b, s) => t.slice(0, a) + s + t.slice(b);
function ensureStructure(t) { return "Synopsis:\n\nClaude adjust:\n\n---\n\n" + t; }   // a free-form file keeps its text as the body
/* replace one part ("syn", "adj", "body" or "notes") and leave every other byte as it was */
function setPart(t, part, v) {
  t = t ?? ""; v = cleanPart(part, v);
  let P = parseBeat(t);
  if (!P.ok) {
    if (part === "body") { const s = P.body; return s.cs === s.ce || !v.trim() ? v : spliceText(t, s.cs, s.ce, v); }
    if (!v.trim()) return t;
    t = ensureStructure(t); P = parseBeat(t);
  }
  v = part === "syn" || part === "adj" ? v.trim() : v.replace(/^(?:[ \t]*\n)*/, "").trimEnd();   // surrounding blank space belongs to the layout, not the text
  const s = P[part], has = v !== "";
  if (part === "notes" && s.missing) {
    if (!has) return t;
    const sep = t.endsWith("\n\n") || t === "" ? "" : t.endsWith("\n") ? "\n" : "\n\n";
    return t + sep + NOTES_MARK + "\n\n" + v + "\n";
  }
  if (s.missing) {   // a Synopsis or Claude adjust line that isn't there yet
    if (!has) return t;
    return spliceText(t, s.at, s.at, part === "syn" ? `Synopsis: ${v}\n\n` : `Claude adjust:\n\n${v}\n\n`);
  }
  if (s.value === v) return t;
  if (has && s.cs !== s.ce) return spliceText(t, s.cs, s.ce + t.slice(s.ce).match(/^[ \t]*/)[0].length, v);   // the usual case: only the text itself changes
  const canon = {   // an empty part filled in, or a part emptied: use the standard spacing
    syn: has ? " " + v + "\n\n" : "\n\n",
    adj: has ? "\n\n" + v + "\n\n" : "\n\n",
    body: has ? "\n" + v + (P.notes.missing ? "\n" : "\n\n") : "\n",
    notes: has ? "\n" + v + "\n" : "\n"

  return spliceText(t, s.a, s.b, canon);
}
function getField(t, key) { return beatParts(t).fields[key.toLowerCase()] ?? ""; }
/* set one "Key: value" header line; a new key goes after the existing ones */
function setField(t, key, v) {
  t = t ?? ""; v = String(v ?? "").replace(/[\r\n]+/g, " ").trim();
  let P = parseBeat(t);
  if (!P.ok) { if (!v) return t; t = ensureStructure(t); P = parseBeat(t); }
  const f = P.fields.find(x => x.key.toLowerCase() === key.toLowerCase());
  if (f) {
    if (t.slice(f.vs, f.ve).trim() === v) return t;
    return t.slice(f.vs, f.ve).trim() && v ? spliceText(t, f.vs, f.ve, v) : spliceText(t, f.colon, f.ve, v ? " " + v : "");
  }
  if (!v) return t;
  return spliceText(t, P.fieldInsert, P.fieldInsert, `${key}: ${v}\n`);
}
const NEW_FIELDS = { Figure: ["Script", "Output", "Data", "Caption"], Table: ["Script", "Output", "Data", "Caption"], Experiment: ["Hypothesis", "Code", "Run", "Last run", "Outcome: not run"], References: ["Question", "Keys"] };
function newBeatText(id, type = "Paragraph") {   // the empty template, with the type's own fields
  const extra = (NEW_FIELDS[type] || []).map(f => f.includes(":") ? f + "\n" : f + ":\n").join("");
  return `ID: ${id}\nType: ${type}\nStatus:\n${extra}Synopsis:\n\nClaude adjust:\n\n---\n\n`;
}
const newId = () => "b-" + Math.random().toString(36).slice(2, 8).padEnd(6, "0");
const countWords = s => ((s || "").match(/[\p{L}\p{N}][\p{L}\p{N}'’\-]*/gu) || []).length;
const isBlankBeat = p => !p.syn.trim() && !p.adj.trim() && !p.body.trim() && !p.notes.trim();

/* ---------- three-way merge of text, line by line ---------- */
function lcsPairs(a, b) {   // map from index in a to index in b for the longest common subsequence of lines
  const out = new Map();

  const s = mapCaret(ta.value, v, ta.selectionStart), e = mapCaret(ta.value, v, ta.selectionEnd), top = ta.scrollTop, left = ta.scrollLeft;
  ta.value = v; ta.setSelectionRange(s, e); ta.scrollTop = top; ta.scrollLeft = left;
}
async function pollCode() {   // after Claude's round of edits: bring the open code file up to date, merging with your typing
  const c = code, ta = $("c-text"); if (!c || !ta || c.readOnly || c.conflict) return;
  const f = await fileAt(c.path); if (!f || f.lastModified === c.mtime || code !== c) return;
  const disk = await f.text(); c.mtime = f.lastModified;
  if (disk === c.base) return;
  const mine = ta.value;
  if (mine === c.base) { setCodeText(disk); c.base = disk; setCodeStatus(`Updated from disk ${fmtTime(f.lastModified)}`); flashCode(); return; }
  const r = merge3(c.base, mine, disk);
  if (r.conflict) { c.conflict = { mine, theirs: disk }; c.base = disk; showCodeConflict(); return; }
  setCodeText(r.text); c.base = disk; flashCode(); clearTimeout(codeTimer); codeTimer = setTimeout(() => track(saveCode()), 300);
}
function flashCode() { const w = panel.querySelector(".codewrap"); if (w) { w.classList.remove("flashc"); void w.offsetWidth; w.classList.add("flashc"); } }
function showCodeConflict() {
  const c = code, box = $("c-conflict"); if (!c || !box) return;
  box.hidden = false; $("c-text").readOnly = true;
  box.innerHTML = `<p><b>Claude changed the same lines of <code>${esc(c.path)}</code> while you were editing.</b> Nothing is written until you choose; the version you don't keep goes to Backups/Conflicts.</p>
    <div class="btnrow"><button id="cc-mine">Keep mine</button><button id="cc-theirs">Take Claude's</button></div>`;
  setCodeStatus("Needs your choice");
  const done = async keepMine => {
    const name = c.path.split("/").pop();
    try {
      const d = await (await subdir(BACKUP_DIR, true)).getDirectoryHandle("Conflicts", { create: true });
      await writeText(d, `${stamp()} ${name} (${keepMine ? "Claude's version" : "your version"}).txt`, keepMine ? c.conflict.theirs : c.conflict.mine);
    } catch (e) { return setStatus("Couldn't save the backup copy, so nothing was changed: " + e.message, true); }
    const keep = keepMine ? c.conflict.mine : c.conflict.theirs;
    c.conflict = null; box.hidden = true; $("c-text").readOnly = false;
    setCodeText(keep);
    if (keepMine) await track(saveCode()); else { c.base = keep; setCodeStatus("Took Claude's version"); }
  };
  $("cc-mine").onclick = () => done(true); $("cc-theirs").onclick = () => done(false);
}

/* ================= LaTeX: the paper assembled from the beats, for Overleaf =================
   The paper is built in document order: each section is a \section (an "Abstract" section becomes the abstract),
   Paragraph beats are their text converted from Markdown (LaTeX passes through), Figure and Table beats become floats.
   It goes into the conference template at export/template/main.tex, at the line "%% PAPERBOARD BODY" (or where it says
   \input{paperboard-body}); without a template, a plain article is used. Overleaf compiles it (see overleaf.js). */
const TEMPLATE_DIR = "export/template", MAIN_TEX = TEMPLATE_DIR + "/main.tex", BODY_MARK = /^[ \t]*%%[ \t]*PAPERBOARD[ \t]+BODY.*$/m, BODY_INPUT = /\\input\s*\{\s*paperboard-body(?:\.tex)?\s*\}/;
const DEFAULT_TEMPLATE = (title, hasBib) => `\\documentclass[11pt]{article}
\\usepackage[utf8]{inputenc}
\\usepackage[T1]{fontenc}
\\usepackage{lmodern}
\\usepackage{microtype}
\\usepackage[margin=1in]{geometry}
\\usepackage{amsmath,amssymb}
\\usepackage{graphicx}
\\usepackage{booktabs}
\\usepackage[authoryear,round]{natbib}
\\usepackage{hyperref}
\\title{${texEscape(title)}}
\\author{}
\\date{\\today}
\\begin{document}
\\maketitle
%% PAPERBOARD BODY
${hasBib ? "\\bibliographystyle{plainnat}\n\\bibliography{references}\n" : ""}\\end{document}
`;
const latexOpts = () => { meta.latex ||= {}; meta.latex.include ||= {}; return meta.latex; };
const INCLUDABLE = ["Experiment", "References", "Note"];   // left out unless you tick them

/* ---------- the body ---------- */
function floatTex(b, p, kind) {   // a Figure or Table beat as a float
  const outs = listField(p.fields.output).map(relPath).filter(Boolean);
  const label = (p.fields.label || "").trim() || `${kind === "figure" ? "fig" : "tab"}:${slugify(b.title)}`;
  const env = /^(yes|true|full|wide)$/i.test(p.fields.wide || "") ? kind + "*" : kind;
  const short = p.fields.caption ? mdInline(p.fields.caption) : "", long = p.body.trim() ? mdInline(p.body.trim().replace(/\n+/g, " ")) : short;
  let inner;
  if (kind === "figure") {
    const pick = outs.find(o => /\.pdf$/i.test(o)) || outs.find(o => /\.(png|jpe?g)$/i.test(o)) || outs[0];
    inner = pick ? `  \\includegraphics[width=${p.fields.width || "\\linewidth"}]{${pick}}` : `  \\fbox{\\parbox{0.9\\linewidth}{\\centering Figure “${texEscape(b.title)}” has no Output yet.}}`;
  } else {
    const tex = outs.find(o => /\.tex$/i.test(o)), csv = outs.find(o => /\.(csv|tsv)$/i.test(o)), img = outs.find(o => /\.(pdf|png|jpe?g)$/i.test(o));
    inner = tex ? `  \\input{${tex}}` : csv ? `  %%CSV:${csv}%%` : img ? `  \\includegraphics[width=\\linewidth]{${img}}` : `  \\fbox{Table “${texEscape(b.title)}” has no Output yet.}`;
  }
  const cap = long ? `  \\caption${short && short !== long ? `[${short}]` : ""}{${long}}\n` : "";
  return kind === "table" ? `\\begin{${env}}[t]\n  \\centering\n${cap}${inner}\n  \\label{${label}}\n\\end{${env}}` : `\\begin{${env}}[t]\n  \\centering\n${inner}\n${cap}  \\label{${label}}\n\\end{${env}}`;
}
function beatLatex(b, p = beatParts(b.text)) {   // one beat's LaTeX ("" for an empty beat)
  if (p.type === "Figure") return floatTex(b, p, "figure");
  if (p.type === "Table") return floatTex(b, p, "table");
  if (!p.body.trim()) return "";
  if (p.type === "Paragraph") return mdToLatex(p.body);
  return `\\paragraph{${mdInline(b.title)}.}\n` + mdToLatex(p.body);
}
const beatIncluded = p => !(INCLUDABLE.includes(p.type) && !latexOpts().include[p.type]);
function buildBody() {
  const parts = [];
  docOrder().forEach(({ act, beats: list }) => {
    const isAbstract = /^abstract$/i.test(act.name.trim());
    const chunk = [];
    list.forEach(b => {
      const p = beatParts(b.text); if (!beatIncluded(p)) return;
      const tag = `% beat: ${b.title.replace(/\n/g, " ")} (${b.key})`, tex = beatLatex(b, p);
      chunk.push(tex ? tag + "\n" + tex : tag + " (empty)");
    });
    if (isAbstract) { if (chunk.length) parts.push(`% section: ${act.name}\n\\begin{abstract}\n${chunk.join("\n\n")}\n% end: ${act.name}\n\\end{abstract}`); }
    else parts.push(`% section: ${act.name}\n\\section{${mdInline(act.name)}}\n\\label{sec:${slugify(act.name)}}\n\n${chunk.join("\n\n")}`);
  });
  return `% Written by Paperboard from the beats, in document order. Edit the beats, not this file.\n\n${parts.join("\n\n")}\n`;
}
async function csvTable(path) {   // a CSV table output, as a booktabs tabular
  const f = await fileAt(path); if (!f) return `\\fbox{Missing ${texEscape(path)}}`;
  const rows = csvRows(await f.text(), /\.tsv$/i.test(path) ? "\t" : ",", 500).filter(r => r.some(c => c.trim()));
  if (!rows.length) return "";
  const n = Math.max(...rows.map(r => r.length)), al = rows[1] ? rows[1].map(c => /^-?[\d.,]+%?$/.test(c.trim()) ? "r" : "l").join("") : "l".repeat(n);
  return `\\begin{tabular}{${al.padEnd(n, "l")}}\n\\toprule\n${rows[0].map(c => uniToTex(texEscape(c))).join(" & ")} \\\\\n\\midrule\n${rows.slice(1).map(r => r.map(c => uniToTex(texEscape(c))).join(" & ") + " \\\\").join("\n")}\n\\bottomrule\n\\end{tabular}`;
}
/* the whole paper: the template with the body put in, and every file it needs */
async function assemblePaper() {
  let body = buildBody();
  for (const m of [...body.matchAll(/^  %%CSV:(.+)%%$/gm)]) body = body.replace(m[0], (await csvTable(m[1])).replace(/^/gm, "  "));
  const tmplFile = await fileAt(MAIN_TEX), bib = await fileAt("References/references.bib");
  let main = tmplFile ? await tmplFile.text() : DEFAULT_TEMPLATE(root.name, !!bib && /\\cite|\\citep|\\citet/.test(body));
  const notes = [];
  if (BODY_MARK.test(main)) main = main.replace(BODY_MARK, () => BODY_START + "\n" + body + BODY_END);
  else if (BODY_INPUT.test(main)) main = main.replace(BODY_INPUT, () => BODY_START + "\n" + body + BODY_END);
  else {
    const at = main.search(/\\bibliography\s*\{|\\printbibliography|\\end\{document\}/);
    if (at < 0) throw new Error(`${MAIN_TEX} has no \\end{document}.`);
    main = main.slice(0, at) + BODY_START + "\n" + body + BODY_END + "\n" + main.slice(at);
    notes.push(`${MAIN_TEX} has no “%% PAPERBOARD BODY” line, so the paper went in before the bibliography. Add that line where the paper belongs.`);
  }
  const files = [];   // template files (except main.tex), at the top level as the template expects
  const tdir = await handleAt(TEMPLATE_DIR, "dir");
  if (tdir) for (const f of await listFiles(TEMPLATE_DIR, 4)) { if (f.path === MAIN_TEX) continue; files.push({ path: f.path.slice(TEMPLATE_DIR.length + 1), content: new Uint8Array(await (await fileAt(f.path)).arrayBuffer()) }); }
  if (bib) files.push({ path: "references.bib", content: await bib.text() });
  const missing = [];
  for (const a of new Set([...latexAssets(main)])) {   // figures and \input files, from the project at the same paths
    const rp = relPath(a); if (!rp || files.some(f => f.path === rp)) continue;
    const cands = /\.[a-z0-9]+$/i.test(rp) ? [rp] : [rp + ".pdf", rp + ".png", rp + ".jpg", rp + ".tex"];
    let found = false;
    for (const c of cands) { const f = await fileAt(c); if (f) { files.push({ path: c, content: new Uint8Array(await f.arrayBuffer()) }); found = true; break; } }
    if (!found && !files.some(f => f.path === rp || f.path.startsWith(rp + "."))) missing.push(a);
  }
  if (missing.length) notes.push(`Not found in the project: ${missing.join(", ")}.`);
  return { main, body, files, notes, template: tmplFile ? MAIN_TEX : null };
}

/* ---------- the Overleaf panel: template, what to include, and the sync ---------- */

  panel.hidden = false; panel.querySelector(".x").onclick = closePanel;

$("olbtn").onclick = () => { if (meta) showOverleafPanel(); };
const SYNC_SCRIPT_TEXT = "#!/bin/bash\n# Sync with Overleaf (written by Paperboard). Double-click to send the paper to Overleaf and bring Overleaf's edits back.\n#\n# export/overleaf/ is a git copy of your Overleaf project. Paperboard keeps the paper written into it, and this script:\n#   1. commits what Paperboard wrote,\n#   2. pulls Overleaf's changes and merges them,\n#   3. pushes the result to Overleaf.\n# Paperboard (open in Chrome) then merges Overleaf's edits back into the beats.\n# If both sides changed the same lines, this script sets the three versions aside in export/overleaf-merge/ and takes\n# Overleaf's version; Paperboard merges them beat by beat and asks you where they clash; then double-click again.\n#\n# The Overleaf token is kept in your macOS Keychain (service \"Paperboard Overleaf\"), never in a file.\n\ncd \"$(dirname \"$0\")\" || exit 1\nREPO=\"export/overleaf\"\nSERVICE=\"Paperboard Overleaf\"\nTRIPLES=\"main.tex references.bib\"\nsay() { printf '%s\\n' \"$*\"; }\nfinish() { say \"\"; say \"$1\"; say \"\"; [ -t 0 ] && [ -z \"$PAPERBOARD_NO_PAUSE\" ] && read -n 1 -s -r -p \"Press any key to close.\"; echo; exit \"${2:-0}\"; }\n\ncommand -v git >/dev/null 2>&1 || finish \"git isn't installed. Run 'xcode-select --install' in Terminal, then try again.\" 1\n\ntoken_get() {\n  if [ -n \"$PAPERBOARD_OVERLEAF_TOKEN\" ]; then printf %s \"$PAPERBOARD_OVERLEAF_TOKEN\"; return; fi\n  security find-generic-password -a \"$USER\" -s \"$SERVICE\" -w 2>/dev/null\n}\nTOKEN=\"$(token_get)\"\nif [ -z \"$TOKEN\" ]; then\n  say \"Paste your Overleaf Git authentication token (Overleaf: Account Settings > Git integration),\"\n  say \"then press Return. It goes into your macOS Keychain; you won't be asked again.\"\n  read -r -s TOKEN; echo\n  [ -n \"$TOKEN\" ] || finish \"No token given; nothing changed.\" 1\n  security add-generic-password -U -a \"$USER\" -s \"$SERVICE\" -l \"Paperboard Overleaf token\" -w \"$TOKEN\" >/dev/null || finish \"Couldn't save the token to the Keychain.\" 1\nfi\n\nASKPASS=\"$(mktemp -t paperboard-askpass.XXXXXX)\" || exit 1\ntrap 'rm -f \"$ASKPASS\"' EXIT\nprintf '#!/bin/sh\\ncase \"$1\" in *sername*) echo git ;; *) printf \"%%s\\\\n\" \"$PAPERBOARD_TOKEN\" ;; esac\\n' > \"$ASKPASS\"\nchmod 700 \"$ASKPASS\"\nexport GIT_ASKPASS=\"$ASKPASS\" PAPERBOARD_TOKEN=\"$TOKEN\" GIT_TERMINAL_PROMPT=0\ngit_() { git -c credential.helper= -c core.quotepath=off \"$@\"; }\n\nif [ ! -d \"$REPO/.git\" ]; then\n  say \"Connecting this project to Overleaf.\"\n  say \"Paste the project's Git link (Overleaf: Menu > Integrations > Git), e.g. https://git.overleaf.com/0123456789abcdef01234567\"\n  read -r URL\n  URL=\"$(printf %s \"$URL\" | sed -E 's#^ *git clone +##; s#^(https?://)[^@/]*@#\\1#; s# *$##')\"\n  [ -n \"$URL\" ] || finish \"No link given; nothing changed.\" 1\n  mkdir -p export\n  if [ -e \"$REPO\" ] && [ -n \"$(ls -A \"$REPO\" 2>/dev/null)\" ]; then\n    TMP=\"$REPO.clone-$$\"\n    git_ clone -q \"$URL\" \"$TMP\" || finish \"Couldn't reach that Overleaf project. Check the link and the token (to re-enter the token, delete 'Paperboard Overleaf' in Keychain Access).\" 1\n    mv \"$TMP/.git\" \"$REPO/.git\" && rm -rf \"$TMP\"\n  else\n    git_ clone -q \"$URL\" \"$REPO\" || finish \"Couldn't reach that Overleaf project. Check the link and the token (to re-enter the token, delete 'Paperboard Overleaf' in Keychain Access).\" 1\n  fi\n  git_ -C \"$REPO\" config user.name \"${PAPERBOARD_GIT_NAME:-Paperboard}\"\n  git_ -C \"$REPO\" config user.email \"${PAPERBOARD_GIT_EMAIL:-paperboard@localhost}\"\n  finish \"Connected. Paperboard (open in Chrome) now puts the paper into export/overleaf. Double-click this again to send it to Overleaf.\"\nfi\n\ncd \"$REPO\" || exit 1\nBR=\"$(git_ rev-parse --abbrev-ref HEAD)\"\ngit_ add -A\ngit_ diff --cached --quiet || git_ commit -q -m \"Paperboard $(date '+%Y-%m-%d %H:%M')\"\ngit_ fetch -q origin || finish \"Couldn't reach Overleaf. Check your connection (and the token: to re-enter it, delete 'Paperboard Overleaf' in Keychain Access).\" 1\n\nif ! git_ merge -q --no-edit \"origin/$BR\" >/dev/null 2>&1; then\n  STAMP=\"$(date '+%Y-%m-%d-%H%M%S')\"\n  OUT=\"../overleaf-merge/$STAMP\"\n  mkdir -p \"$OUT\"\n  BASE=\"$(git_ merge-base HEAD \"origin/$BR\")\"\n  for f in $TRIPLES; do\n    git_ show \"$BASE:$f\" > \"$OUT/base-$f\" 2>/dev/null || rm -f \"$OUT/base-$f\"\n    git_ show \"HEAD:$f\" > \"$OUT/ours-$f\" 2>/dev/null || rm -f \"$OUT/ours-$f\"\n    git_ show \"origin/$BR:$f\" > \"$OUT/theirs-$f\" 2>/dev/null || rm -f \"$OUT/theirs-$f\"\n  done\n  git_ merge --abort 2>/dev/null\n  git_ reset -q --hard \"origin/$BR\"\n  finish \"Overleaf and Paperboard both changed the same lines. Paperboard is merging them beat by beat and will ask you where they clash. Then double-click this again to send the result.\"\nfi\n\nAHEAD=\"$(git_ rev-list --count \"origin/$BR..HEAD\")\"\nif [ \"$AHEAD\" != \"0\" ]; then git_ push -q origin \"HEAD:$BR\" || finish \"Overleaf refused the push (someone may have just edited). Double-click again.\" 1; fi\nfinish \"Synced with Overleaf. Sent: $([ \"$AHEAD\" != \"0\" ] && echo yes || echo nothing new). Paperboard is bringing Overleaf's edits into the beats.\"\n";

/* ================= Overleaf: export/overleaf is a git copy of the Overleaf project =================
   Paperboard keeps the paper written into it (main.tex with the % beat: markers, the template's files, references.bib,
   the figures). "Sync with Overleaf.command", double-clicked in the project folder, commits that, pulls Overleaf's
   changes, merges them and pushes. When the pull brings edits, Paperboard merges each beat's edits back into the beat,
   preamble edits into export/template/main.tex and new references into References/references.bib.
   export/.overleaf-sent/ holds what Paperboard last wrote, so it can tell Overleaf's edits from its own. */
const OL_DIR = "export/overleaf", OL_SENT = "export/.overleaf-sent", OL_MERGE = "export/overleaf-merge", SYNC_SCRIPT = "Sync with Overleaf.command";
const olOpts = () => { meta.overleaf ||= {}; meta.overleaf.done ||= []; return meta.overleaf; };
let olLast = { stamp: null, merges: "" }, olInfo = { linked: false, imported: null, notes: [] };
async function olRepo() { const d = await handleAt(OL_DIR, "dir"); if (!d) return null; try { await d.getDirectoryHandle(".git"); return d; } catch (e) { return null; } }
async function readAt(path) { const f = await fileAt(path); return f ? f.text() : null; }
async function writeAt(path, content) {   // creates folders as needed; writes only if the content differs
  const old = await fileAt(path);
  if (old) {
    if (typeof content === "string") { if (await old.text() === content) return false; }
    else if (old.size === content.length) { const a = new Uint8Array(await old.arrayBuffer()); let same = true; for (let i = 0; i < a.length; i++) if (a[i] !== content[i]) { same = false; break; } if (same) return false; }
  }
  const h = await handleAt(path, "file", true); if (!h) throw new Error("Can't write " + path);
  const w = await h.createWritable(); await w.write(content); await w.close(); return true;
}
async function olStamp() { const f = await fileAt(OL_DIR + "/main.tex"); return f ? f.lastModified + ":" + f.size : null; }

/* ---------- Paperboard -> export/overleaf ---------- */
let olTimer = null;
function olExportSoon() { clearTimeout(olTimer); olTimer = setTimeout(() => { if (root && meta) enqueue("overleaf", olSync).catch(e => console.warn("Overleaf", e)); }, 3000); }
async function olExport() {
  if (!(await olRepo())) return;
  const paper = await assemblePaper();
  const cur = await readAt(OL_DIR + "/main.tex"), sent = await readAt(OL_SENT + "/main.tex");
  if (cur != null && sent != null && !splitPaperTex(cur)) {   // the markers were taken out in Overleaf: don't overwrite their file
    olInfo.notes = ["Overleaf's main.tex no longer has Paperboard's markers, so Paperboard isn't overwriting it. Restore the markers in Overleaf (its history has them), or move export/overleaf/main.tex aside to start fresh."];
    renderOverleaf(); return;
  }
  await writeAt(OL_DIR + "/main.tex", paper.main); await writeAt(OL_SENT + "/main.tex", paper.main);
  for (const f of paper.files) {
    if (f.path === "README.md") continue;
    await writeAt(OL_DIR + "/" + f.path, f.content);
    if (f.path === "references.bib") await writeAt(OL_SENT + "/references.bib", f.content);
  }
  olLast.stamp = await olStamp();
}

/* ---------- export/overleaf -> the beats ---------- */
function bodyFromLatex(p, b, tex) {
  if (p.type !== "Paragraph") { const head = `\\paragraph{${mdInline(b.title)}.}`; if (tex.startsWith(head)) tex = tex.slice(head.length).replace(/^\n/, ""); }
  return latexToMd(tex);
}
function applyOverleaf(baseTex, theirsTex, notes) {   // merge Overleaf's edits (base -> theirs) into the beats; returns how many beats changed
  const B = splitPaperTex(baseTex), T = splitPaperTex(theirsTex);
  if (!B || !T) { notes.push("The Paperboard markers are missing from Overleaf's main.tex, so its edits couldn't be matched to beats."); return 0; }
  let n = 0;
  for (const [key, tBlock] of T.blocks) {
    const bBlock = B.blocks.get(key); if (bBlock === undefined || bBlock === tBlock) continue;
    const b = beatByKey(key); if (!b) { notes.push(`Overleaf edited text for a beat that no longer exists (${key}); it's in export/overleaf/main.tex.`); continue; }
    if (conflicts[key]) { notes.push(`“${b.title}” already needs your choice; Overleaf's edit to it waits until the next sync.`); continue; }
    const p = beatParts(b.text);
    if (p.type === "Figure" || p.type === "Table") {   // floats aren't rebuilt from LaTeX: keep Overleaf's version in the beat's notes
      b.text = setPart(b.text, "notes", (p.notes ? p.notes + "\n\n" : "") + `Overleaf edit (${today()}), not applied automatically:\n\n${tBlock}`);
      applyBeatText(b, b.text); markChanged(key); saveTextSoon(b); n++;
      notes.push(`Overleaf changed the ${p.type.toLowerCase()} “${b.title}”; its LaTeX is in the beat's Notes.`); continue;
    }
    const mine = beatLatex(b, p);
    let merged;
    if (mine === bBlock) merged = tBlock;
    else {
      const r = merge3(bBlock, mine, tBlock);
      if (r.conflict) {
        conflicts[key] = { who: "Overleaf", mine: b.text, theirs: setPart(b.text, "body", bodyFromLatex(p, b, tBlock)), merged: setPart(b.text, "body", r.text) };
        markChanged(key); paintCard(b); updateConflictBtn(); n++; continue;
      }
      merged = r.text;
    }
    const nt = setPart(b.text, "body", bodyFromLatex(p, b, merged));
    if (nt !== b.text) { applyBeatText(b, nt); markChanged(key); saveTextSoon(b); n++; }
  }
  for (const key of B.blocks.keys()) if (!T.blocks.has(key) && beatByKey(key)) notes.push(`The “% beat:” line for “${beatByKey(key).title}” was removed in Overleaf, so edits there couldn't be matched. Put the line back in Overleaf.`);
  for (const [name, t] of T.sections) if (B.sections.has(name) && B.sections.get(name) !== t && !name.startsWith("end: ")) notes.push(`Overleaf changed the heading of “${name}”. Rename sections in Paperboard's Settings.`);
  return n;
}
async function applyTemplateEdits(baseTex, theirsTex, notes) {   // preamble and ending: back into export/template/main.tex
  const B = splitPaperTex(baseTex), T = splitPaperTex(theirsTex); if (!B || !T || (B.pre === T.pre && B.post === T.post)) return;
  const tmpl = await readAt(MAIN_TEX);
  if (tmpl == null) { await writeAt(MAIN_TEX, T.pre + "%% PAPERBOARD BODY" + T.post); notes.push(`Overleaf's preamble is now the template, in ${MAIN_TEX}.`); return; }
  const m = tmpl.match(BODY_MARK); if (!m) { notes.push(`Overleaf changed the preamble, but ${MAIN_TEX} has no %% PAPERBOARD BODY line to line it up with.`); return; }
  const tpre = tmpl.slice(0, m.index), tpost = tmpl.slice(m.index + m[0].length);
  const a = merge3(B.pre, tpre, T.pre), c = merge3(B.post, tpost, T.post);
  if (a.conflict || c.conflict) { await backupFile("overleaf-template-main.tex", theirsTex); notes.push(`Overleaf and Paperboard both changed the template's preamble; Overleaf's whole file is in Backups. ${MAIN_TEX} is unchanged.`); return; }
  if (await writeAt(MAIN_TEX, a.text + m[0] + c.text)) notes.push(`Brought Overleaf's preamble changes into ${MAIN_TEX}.`);
}
async function applyBibEdits(base, theirs, notes) {
  if (base == null || theirs == null || base === theirs) return;
  const mine = await readAt("References/references.bib") ?? "";
  const r = merge3(base, mine, theirs);
  if (r.conflict) { await backupFile("overleaf-references.bib", theirs); notes.push("Overleaf and Paperboard both changed the same lines of references.bib; Overleaf's version is in Backups. References/references.bib is unchanged."); return; }
  if (await writeAt("References/references.bib", r.text)) notes.push("Brought Overleaf's changes to references.bib into References/references.bib.");
}
async function backupFile(name, text) { const d = await (await subdir(BACKUP_DIR, true)).getDirectoryHandle("Overleaf", { create: true }); await writeText(d, `${stamp()} ${name}`, text); }
async function olImport() {
  if (!(await olRepo())) return;
  const notes = [], o = olOpts(); let n = 0, saw = false;
  // 1. a clash the sync script set aside: merge with the real common version
  for (const dir of await listDirs(OL_MERGE)) {
    if (o.done.includes(dir)) continue;
    const at = n => readAt(`${OL_MERGE}/${dir}/${n}`);
    const base = await at("base-main.tex"), theirs = await at("theirs-main.tex");
    if (base && theirs) { n += applyOverleaf(base, theirs, notes); await applyTemplateEdits(base, theirs, notes); }
    await applyBibEdits(await at("base-references.bib"), await at("theirs-references.bib"), notes);
    o.done.push(dir); saw = true;
    if (theirs) await writeAt(OL_SENT + "/main.tex", theirs);   // Overleaf's version is now what export/overleaf holds
    const tb = await at("theirs-references.bib"); if (tb) await writeAt(OL_SENT + "/references.bib", tb);
  }
  // 2. edits that came in with a clean pull
  const cur = await readAt(OL_DIR + "/main.tex"), sent = await readAt(OL_SENT + "/main.tex");
  if (cur != null && !splitPaperTex(cur)) {   // a fresh Overleaf project: keep its main.tex, then put the paper in
    if (!sent) { await backupFile("overleaf-original-main.tex", cur); notes.push("Saved Overleaf's original main.tex in Backups/Overleaf and put the paper in its place."); }
  } else if (cur != null && sent != null && cur !== sent) {
    n += applyOverleaf(sent, cur, notes); await applyTemplateEdits(sent, cur, notes); saw = true;
    await writeAt(OL_SENT + "/main.tex", cur);
  }
  const curBib = await readAt(OL_DIR + "/references.bib"), sentBib = await readAt(OL_SENT + "/references.bib");
  if (curBib != null && sentBib != null && curBib !== sentBib) { await applyBibEdits(sentBib, curBib, notes); await writeAt(OL_SENT + "/references.bib", curBib); saw = true; }
  if (saw) {
    saveHl(); saveMetaSoon();
    olInfo.imported = Date.now(); olInfo.notes = notes;
    setStatus(n ? `Brought Overleaf's edits into ${plural(n, "beat")}.` : notes.length ? "Synced with Overleaf; see the Overleaf panel." : "Synced with Overleaf: no edits to bring in.", Object.keys(conflicts).length > 0);
    renderOverleaf();
  }
}
async function olSync() { await olImport(); await olExport(); }
async function olPoll() {   // the sync script ran: bring the edits in
  if (!root || !meta) return;
  const repo = await olRepo();
  if (!!repo !== olInfo.linked) { olInfo.linked = !!repo; renderOverleaf(); if (repo) return enqueue("overleaf", olSync); }
  if (!repo) return;
  const st = await olStamp(), merges = (await listDirs(OL_MERGE)).join("|");
  if (st !== olLast.stamp || merges !== olLast.merges) { olLast.merges = merges; await enqueue("overleaf", olSync); olLast.stamp = await olStamp(); }
}

/* ---------- the sync, in the Overleaf panel ---------- */
async function renderOverleaf() {
  const box = $("x-ol"); if (!box) return;
  const repo = await olRepo(), script = await fileAt(SYNC_SCRIPT);
  if (!repo) {
    box.innerHTML = `<b>Overleaf</b> <span class="help">Not linked.</span> <button class="mini" id="x-olsetup">${script ? "Show how to link" : "Set up sync with Overleaf"}</button><div id="x-olhow" hidden></div>`;
    $("x-olsetup").onclick = async () => { if (!script) await writeAt(SYNC_SCRIPT, SYNC_SCRIPT_TEXT); showOlHow(); };
    return;
  }
  box.innerHTML = `<b>Overleaf</b> <span class="help">Linked (export/overleaf). To sync, double-click <b>${SYNC_SCRIPT}</b> in the project folder.${olInfo.imported ? ` Last brought edits in ${fmtTime(olInfo.imported)}.` : ""}</span> <button class="mini" id="x-olsetup">Setup steps</button><div id="x-olhow" hidden></div>` +
    (olInfo.notes.length ? `<div class="warn">${olInfo.notes.map(n => `<p>${esc(n)}</p>`).join("")}</div>` : "");
  $("x-olsetup").onclick = async () => { if (!(await fileAt(SYNC_SCRIPT))) await writeAt(SYNC_SCRIPT, SYNC_SCRIPT_TEXT); showOlHow(); };
}
function showOlHow() {
  const h = $("x-olhow"); if (!h) return; h.hidden = false;
  const cmd = `xattr -c "${SYNC_SCRIPT}"; chmod +x "${SYNC_SCRIPT}"`;
  h.innerHTML = `<ol class="olsteps">
    <li>Paperboard has put <b>${SYNC_SCRIPT}</b> in the project folder. macOS blocks scripts a browser wrote until you allow it, once:
      in Terminal, type <code>cd </code> (with a space), drag the project folder into the window and press Return; then paste this and press Return:
      <div class="cmdrow"><code id="x-olcmd">${esc(cmd)}</code><button class="mini" id="x-olcopy">Copy</button></div>
      <span class="help">Without Terminal: double-click the script, and when macOS refuses, open System Settings &gt; Privacy &amp; Security, scroll down and click Open Anyway.</span></li>
    <li>In Overleaf, open the project and copy its Git link (Menu &gt; Integrations &gt; Git), and create a Git token (Account Settings &gt; Git integration).</li>
    <li>Double-click <b>${SYNC_SCRIPT}</b>. Paste the token and then the link when asked. The token goes into your Mac's Keychain.</li>
    <li>Double-click it again whenever you want to sync. It sends the paper and brings Overleaf's edits back into the beats.</li></ol>
    <p class="help">If double-clicking opens it in an editor instead, or still won't run it: in Terminal, in the project folder, run <code>bash "${SYNC_SCRIPT}"</code>. That always works. To make double-click open it in Terminal, select the file, press ⌘I, set Open with to Terminal, and click Change All.</p>`;
  $("x-olcopy").onclick = async () => { try { await navigator.clipboard.writeText(cmd); $("x-olcopy").textContent = "Copied"; } catch (e) { const r = document.createRange(); r.selectNodeContents($("x-olcmd")); getSelection().removeAllRanges(); getSelection().addRange(r); } };
  renderOverleafLater();
}
function renderOverleafLater() { clearTimeout(renderOverleafLater.t); renderOverleafLater.t = setTimeout(async () => { if (await olRepo()) renderOverleaf(); }, 4000); }
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paperboard</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E %3Crect width='512' height='512' rx='112' fill='#1f4f67'/%3E %3Crect x='64' y='72' width='120' height='368' rx='10' fill='#ffffff' opacity='.07'/%3E %3Crect x='328' y='72' width='120' height='368' rx='10' fill='#ffffff' opacity='.07'/%3E %3Crect x='76' y='132' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Crect x='76' y='296' width='96' height='66' rx='9' fill='#fbfcfc' opacity='.55'/%3E %3Crect x='208' y='218' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Crect x='340' y='150' width='96' height='66' rx='9' fill='#fbfcfc' opacity='.55'/%3E %3Crect x='340' y='318' width='96' height='66' rx='9' fill='#fbfcfc'/%3E %3Cpath d='M124 165 C 190 165, 196 251, 256 251 S 330 351, 380 351' fill='none' stroke='#e8a92a' stroke-width='22' stroke-linecap='round'/%3E %3Ccircle cx='124' cy='165' r='20' fill='#e8a92a'/%3E %3Cpath d='M372 318 L 420 351 L 372 384 Z' fill='#e8a92a'/%3E %3C/svg%3E">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* An infinite board. Sections are vertical bands with draggable boundaries, streams are horizontal lanes, beats are cards with tag tabs. */
:root {
  --board:#eef1f0; --dot:#cdd5d3; --ink:#1d2a2e; --ink-soft:#5b6a6e; --card:#ffffff; --edge:#cbd4d2; --panel:#fbfcfc;
  --accent:#2b6e8f; --band:rgba(43,110,143,.045); --danger:#b02a4a; --select:#e0a21b; --changed:#2f9e5b;
  --note-y:#f5e6a0; --note-b:#cfe5ee; --note-p:#f3d2cc; --note-ink:#2c2a1e;
  --display:"Newsreader", Georgia, serif; --ui:"IBM Plex Sans", system-ui, -apple-system, sans-serif; --marker:"Kalam","Marker Felt","Comic Sans MS",cursive;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --board:#1a1f22; --dot:#2d3539; --ink:#e4ebe9; --ink-soft:#97a6a4; --card:#242b2f; --edge:#3a4549; --panel:#20272a;
  --accent:#6fb0d0; --band:rgba(111,176,208,.06); --danger:#e57a91; --select:#f0bf4c; --changed:#5fd38e;
  --note-y:#5b5330; --note-b:#2f4a55; --note-p:#5a3934; --note-ink:#f1ecd9; color-scheme: dark; } }
html, body { height:100%; margin:0; }
body { background:var(--board); color:var(--ink); font:14px/1.4 var(--ui); overflow:hidden; }
button, input, select, textarea { font:inherit; color:inherit; }
[hidden] { display:none !important; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

#viewport { position:fixed; inset:0; overflow:hidden; touch-action:none; cursor:grab;
  background-image:radial-gradient(var(--dot) 1.1px, transparent 1.2px); background-size:24px 24px; }
#viewport.panning { cursor:grabbing; }
#viewport.inserting { cursor:col-resize; }
#world { position:absolute; left:0; top:0; transform-origin:0 0; }
.band { position:absolute; top:0; }
.band.odd { background:var(--band); }
.divider { position:absolute; top:0; width:18px; margin-left:-9px; cursor:ew-resize; z-index:2; }
.divider::after { content:""; position:absolute; left:8px; top:0; bottom:0; border-left:2px dashed var(--edge); }
.divider:hover::after, .divider.dragging::after { border-left:3px solid var(--accent); }
.lane { position:absolute; left:0; height:0; border-top:1px solid var(--edge); }
#marquee { position:absolute; border:1.5px dashed var(--accent); background:var(--band); pointer-events:none; z-index:7; }
#guide { position:absolute; top:0; width:0; border-left:3px solid var(--select); pointer-events:none; z-index:6; }

svg#links { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
svg#links path { fill:none; stroke:var(--ink-soft); stroke-width:2.5; pointer-events:stroke; cursor:pointer; }
svg#links path.hit { stroke:transparent; stroke-width:16; }
svg#links g.sel path:not(.hit) { stroke:var(--select); stroke-width:3.5; }
svg#links text { fill:var(--ink); font:600 17px var(--ui); paint-order:stroke; stroke:var(--board); stroke-width:5px; }
svg#links marker path { fill:var(--ink-soft); stroke:none; }

/* cards */
.card { position:absolute; width:230px; height:150px; box-sizing:border-box; padding:10px 14px 10px 14px; background:var(--card);
  border:2px solid var(--edge); border-radius:4px; cursor:pointer; box-shadow:0 1px 2px rgba(0,0,0,.06), 0 4px 10px rgba(0,0,0,.04); }
.card .ci { display:flex; flex-direction:column; gap:5px; height:100%; overflow:hidden; }
.card .ty { display:flex; align-items:center; gap:6px; font:600 calc(10.5px * var(--ts, 1))/1 var(--ui); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); min-height:14px; }
.card .ty svg { width:calc(14px * var(--ts, 1)); height:calc(14px * var(--ts, 1)); flex:none; }
.card .ty .st { margin-left:auto; text-transform:none; letter-spacing:0; font-weight:500; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.card h3 { margin:0; font:600 calc(18px * var(--ts, 1))/1.15 var(--display); text-wrap:balance; overflow-wrap:anywhere; }
.card p { margin:0; font:400 calc(12.5px * var(--ts, 1))/1.4 var(--ui); color:var(--ink-soft); white-space:pre-line; display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; }
.card.dragging { box-shadow:0 10px 28px rgba(0,0,0,.18); z-index:5; cursor:grabbing; }
.card.picked, .card.active { outline:3px solid var(--select); outline-offset:2px; }
.card.selected, .note.selected { outline:3px solid var(--accent); outline-offset:2px; }
.tabs { position:absolute; left:10px; right:6px; top:100%; display:flex; gap:3px; flex-wrap:nowrap; overflow:hidden; pointer-events:none; }
.tab { font:600 calc(11px * var(--ts, 1))/1 var(--ui); letter-spacing:.03em; padding:2px 6px 3px; border-radius:0 0 4px 4px; white-space:nowrap; flex:none; max-width:110px; overflow:hidden; text-overflow:ellipsis; }
.tab.adjtab { background:var(--select); color:#1d2a2e; }
.tab.claudetab { background:#1f3f8f; color:#fff; }
.claudetext { color:#1f3f8f; }
@media (prefers-color-scheme: dark) { .claudetext { color:#8fb0ff; } }
/* zoomed far out, titles grow (--zf) so the whole document stays readable */
#world[data-zoom="far"] .tab { font-size:calc(9px * var(--ts, 1) * var(--zf, 1)); padding:3px 8px 5px; max-width:none; }
#world[data-zoom="far"] .card .ci { justify-content:center; }
#world[data-zoom="far"] .card h3 { font-size:calc(15px * var(--ts, 1) * var(--zf, 1)); line-height:1.08; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:break-word; hyphens:auto; }
#world[data-zoom="far"] .card p, #world[data-zoom="mid"] .card p, #world[data-zoom="far"] .card .ty { display:none; }
.card.changed { box-shadow:0 0 0 4px var(--changed), 0 6px 18px rgba(0,0,0,.12); }
.card.changed::before { content:"Updated"; position:absolute; top:-11px; right:10px; z-index:1; background:var(--changed); color:#fff;
  font:600 calc(10px * var(--ts, 1))/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; padding:3px 6px 4px; border-radius:3px; }
#world[data-zoom="far"] .card.changed::before, #world[data-zoom="far"] .card.conflict::before { font-size:calc(8px * var(--zf, 1)); top:calc(-9px * var(--zf, 1)); padding:4px 8px 5px; }
.card.conflict { box-shadow:0 0 0 4px var(--danger), 0 6px 18px rgba(0,0,0,.12); }
.card.conflict::before { content:"Needs your choice"; position:absolute; top:-11px; right:10px; z-index:1; background:var(--danger); color:#fff;
  font:600 calc(10px * var(--ts, 1))/1 var(--ui); letter-spacing:.06em; text-transform:uppercase; padding:3px 6px 4px; border-radius:3px; }
.card.flash { animation:flash 1.8s ease-out 1; }
@keyframes flash { 0% { box-shadow:0 0 0 18px var(--changed); } 100% { box-shadow:0 0 0 4px var(--changed), 0 6px 18px rgba(0,0,0,.12); } }
@media (prefers-reduced-motion: reduce) { .card.flash { animation:none; } }

/* sticky notes */
.note { position:absolute; width:200px; min-height:140px; background:var(--note-y); color:var(--note-ink); box-shadow:0 2px 6px rgba(0,0,0,.12); transform:rotate(-1deg); display:flex; flex-direction:column; }
.note.b { background:var(--note-b); } .note.p { background:var(--note-p); }
.note .grip { height:22px; cursor:move; display:flex; justify-content:flex-end; align-items:center; gap:2px; padding:0 4px; }
.note .grip button { border:0; background:transparent; cursor:pointer; font-size:13px; padding:2px 5px; border-radius:2px; color:var(--note-ink); opacity:.7; }
.note .grip button:hover { opacity:1; background:rgba(0,0,0,.08); }
.note .grip button.armed { opacity:1; background:var(--danger); color:#fff; }
.note textarea { flex:1; min-height:110px; border:0; background:transparent; resize:none; padding:2px 12px 12px; font:400 19px/1.25 var(--marker); color:var(--note-ink); outline:none; }
.note.picked { outline:3px solid var(--select); outline-offset:3px; }

/* chrome */
.chrome { position:fixed; z-index:20; background:var(--panel); border:1px solid var(--edge); border-radius:6px; box-shadow:0 2px 10px rgba(0,0,0,.08); }
#bar { top:12px; left:12px; display:flex; align-items:center; gap:4px; padding:6px; flex-wrap:wrap; max-width:calc(100% - 24px); box-sizing:border-box; }
#bar .logo { display:flex; padding-left:4px; }
#gate .logo { margin-bottom:12px; }
#bar .name { font:600 19px/1 var(--display); padding:0 10px 0 6px; color:var(--accent); max-width:220px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#bar .sep { width:1px; align-self:stretch; background:var(--edge); margin:2px 4px; }
#bar button, .btn { border:1px solid transparent; background:transparent; padding:6px 9px; border-radius:4px; cursor:pointer; font-size:13px; white-space:nowrap; }
#bar button:hover, .btn:hover { background:var(--band); border-color:var(--edge); }
#bar button.on, #bar button.primary { background:var(--accent); color:var(--panel); }
#bar button#clearhl { border-color:var(--changed); color:var(--changed); }
#bar button#clearhl:hover { background:var(--changed); color:#fff; }
#bar button#conflictsbtn { border-color:var(--danger); color:var(--danger); }
#zoomlbl { font-variant-numeric:tabular-nums; font-size:12px; color:var(--ink-soft); min-width:38px; text-align:center; }
#status { font-size:12px; color:var(--ink-soft); padding:0 8px; white-space:nowrap; max-width:340px; overflow:hidden; text-overflow:ellipsis; }
#status.err { color:var(--danger); }
#hint { bottom:56px; left:50%; transform:translateX(-50%); padding:8px 14px; font-size:13px; max-width:calc(100% - 40px); box-sizing:border-box; }

#colhdr { position:fixed; left:0; right:0; height:64px; z-index:11; overflow:hidden; background:var(--board); border-bottom:1px solid var(--edge); box-shadow:0 2px 6px rgba(0,0,0,.05); pointer-events:none; }
#rowhdr { position:fixed; left:0; bottom:0; width:150px; z-index:10; overflow:hidden; background:var(--board); border-right:1px solid var(--edge); box-shadow:2px 0 6px rgba(0,0,0,.05); pointer-events:none; }
#colhdr .cl { position:absolute; top:9px; white-space:nowrap; pointer-events:auto; cursor:pointer; }
#colhdr .cl b { display:block; font:600 22px/1.1 var(--display); color:var(--accent); }
#colhdr .cl small { display:block; margin-top:3px; font:500 12px/1 var(--ui); color:var(--ink-soft); font-variant-numeric:tabular-nums; }
#rowhdr .rl { position:absolute; left:14px; right:8px; font:600 14px/1.2 var(--ui); color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#rowhdr .rl i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:0; }

#legend { bottom:10px; left:162px; right:12px; padding:6px 12px; font-size:12px; display:flex; gap:6px 16px; overflow-x:auto; scrollbar-width:none; }
#legend .row { display:flex; align-items:center; gap:6px; color:var(--ink-soft); white-space:nowrap; flex:none; }
#legend i { width:14px; height:10px; display:inline-block; border-radius:1px; }

/* right-click menu */
#ctx { position:fixed; z-index:35; min-width:220px; max-width:340px; padding:6px; background:var(--panel); border:1px solid var(--edge); border-radius:6px; box-shadow:0 8px 24px rgba(0,0,0,.16); font-size:13px; }
#ctx .h { font:600 11px var(--ui); letter-spacing:.07em; text-transform:uppercase; color:var(--ink-soft); padding:6px 10px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#ctx button.it { display:block; width:100%; text-align:left; border:0; background:transparent; padding:7px 10px; border-radius:4px; cursor:pointer; }
#ctx button.it:hover, #ctx button.it:focus-visible { background:var(--band); outline:none; }
#ctx button.it.danger { color:var(--danger); }
#ctx button.it.danger.armed { background:var(--danger); color:#fff; }
#ctx .row { display:flex; align-items:center; gap:4px; padding:4px 10px; flex-wrap:wrap; }
#ctx .row span { color:var(--ink-soft); margin-right:4px; }
#ctx .row button { border:1px solid var(--edge); background:transparent; border-radius:3px; padding:3px 8px; cursor:pointer; }
#ctx .row button:hover { border-color:var(--accent); }
#ctx hr { border:0; border-top:1px solid var(--edge); margin:5px 2px; }
.tagpick { display:flex; flex-wrap:wrap; gap:5px; }
.tagpick button, #ctx .tg { border:1px solid var(--tc); color:var(--tc); background:transparent; border-radius:3px; padding:3px 8px; font-size:12px; cursor:pointer; }
.tagpick button.on, #ctx .tg.on { background:var(--tc); color:var(--tcf); }
#ctx .tg.some { background:linear-gradient(90deg, var(--tc) 50%, transparent 50%); }

/* panels */
.panel { top:86px; right:12px; width:min(420px, calc(100% - 24px)); max-height:calc(100% - 140px); overflow:auto; padding:18px 20px; box-sizing:border-box; }
.panel header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
.panel .eyebrow { font:600 11px var(--ui); letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); }
.panel h2 { margin:4px 0 0; font:600 22px/1.15 var(--display); }
.panel .x { border:0; background:transparent; cursor:pointer; font-size:20px; color:var(--ink-soft); padding:0 4px; }
.panel label, .panel .lbl { display:block; font:600 11px var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin:14px 0 4px; }
.panel input[type=text], .panel input[type=number], .panel select, .panel textarea { width:100%; box-sizing:border-box; border:1px solid var(--edge); background:var(--card); border-radius:4px; padding:7px 9px; }
.panel input.title { font:600 20px/1.2 var(--display); }
.panel textarea { min-height:240px; resize:vertical; line-height:1.5; }
.panel .btnrow { display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; align-items:center; }
.panel .btnrow button, .panel .mini { border:1px solid var(--edge); background:transparent; border-radius:4px; padding:5px 9px; cursor:pointer; font-size:13px; }
.panel .btnrow button:hover, .panel .mini:hover { border-color:var(--accent); }
.panel button.danger { border-color:var(--danger); color:var(--danger); }
.panel button.danger.armed { background:var(--danger); color:#fff; }
.panel button.primary { background:var(--accent); border-color:var(--accent); color:var(--panel); }
.panel .help { font-size:12.5px; color:var(--ink-soft); margin:8px 0 0; line-height:1.5; }
.panel h3 { margin:18px 0 6px; font:600 15px var(--display); }
.panel h3 small { font:500 12px var(--ui); color:var(--ink-soft); margin-left:6px; font-variant-numeric:tabular-nums; }
.panel ol { margin:8px 0 0; padding-left:22px; font-size:13px; }
.panel ol li { margin:2px 0; }
.panel ol li small { color:var(--ink-soft); font-size:12px; margin-left:4px; }
.panel ol li button { border:0; background:none; padding:0; cursor:pointer; color:inherit; text-align:left; font:inherit; }
.panel ol li button:hover { color:var(--accent); text-decoration:underline; }
.rowedit { display:flex; gap:6px; align-items:center; margin:5px 0; }
.rowedit input[type=text] { flex:1; min-width:0; padding:5px 7px; }
.rowedit input[type=color] { width:30px; height:28px; padding:0; border:1px solid var(--edge); border-radius:4px; background:none; flex:none; }
.rowedit .mini { padding:4px 7px; flex:none; }

/* beat editor */
.panel.editor { display:flex; flex-direction:column; }
.panel.editor.half { right:0; bottom:0; width:50vw; max-height:none; border-radius:0; border-width:0 0 0 1px; }
.panel.editor.full { inset:0 !important; width:auto; max-height:none; border-radius:0; border:0; z-index:30; padding:22px max(24px, calc((100vw - 860px) / 2)); }
@media (max-width:700px) { .panel.editor.half { width:100vw; } }
.sizes { display:flex; gap:2px; border:1px solid var(--edge); border-radius:5px; padding:2px; }
.sizes button { border:0; background:transparent; border-radius:3px; padding:3px 8px; font-size:12px; cursor:pointer; color:var(--ink-soft); }
.sizes button.on { background:var(--accent); color:var(--panel); }
.hdrright { display:flex; gap:8px; align-items:center; }
.meta3 { display:flex; gap:10px; }
.meta3 > div { flex:1; min-width:0; }
.meta3 > div.ty { flex:0 0 160px; }
.etabs { display:flex; gap:2px; margin-top:16px; border-bottom:1px solid var(--edge); flex-wrap:wrap; }
.etabs button { border:1px solid transparent; border-bottom:0; background:transparent; padding:7px 13px; border-radius:5px 5px 0 0; cursor:pointer; font-size:13px; color:var(--ink-soft); margin-bottom:-1px; }
.etabs button:hover { color:var(--ink); background:var(--band); }
.etabs button.on { background:var(--card); border-color:var(--edge); color:var(--ink); font-weight:600; }
.etabs button[data-tab="adj"].on { background:color-mix(in srgb, var(--select) 12%, var(--card)); }
.etabs .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--select); margin-left:6px; vertical-align:1px; }
.pane { display:flex; flex-direction:column; flex:1; min-height:0; }
.mdbar { display:flex; gap:2px; align-items:center; flex-wrap:wrap; padding:4px; border:1px solid var(--edge); border-top:0; border-bottom:0; background:var(--card); }
.mdbar button { border:0; background:transparent; padding:4px 8px; border-radius:3px; cursor:pointer; font-size:13px; min-width:28px; }
.mdbar button:hover { background:var(--band); }
.mdbar button.on { background:var(--band); color:var(--accent); font-weight:600; }
.mdbar .grow { flex:1; }
.mdbar .wc { font-size:12px; color:var(--ink-soft); padding:0 6px; font-variant-numeric:tabular-nums; }
.mdwrap { flex:1; min-height:260px; display:flex; border:1px solid var(--edge); border-top:0; border-radius:0 0 4px 4px; overflow:hidden; background:var(--card); }
.pane[data-pane="beat"] .mdwrap { border-top:1px solid var(--edge); border-radius:0 0 4px 4px; }
.panel.editor:not(.half):not(.full) .mdwrap { flex:none; height:300px; }
.panel textarea.md { flex:1; min-width:0; border:0; border-radius:0; min-height:0; height:auto; resize:none; padding:14px 16px; font:400 17px/1.65 var(--display); background:var(--card); }
.panel textarea.md:focus-visible { outline:none; }
.mdprev { flex:1; min-width:0; overflow:auto; padding:10px 18px; font:400 17px/1.65 var(--display); border-left:1px solid var(--edge); overflow-wrap:anywhere; }
.mdprev h1, .mdprev h2, .mdprev h3 { font-family:var(--display); line-height:1.2; margin:.8em 0 .4em; }
.mdprev blockquote { margin:.6em 0; padding-left:14px; border-left:3px solid var(--edge); color:var(--ink-soft); }
.mdprev p { margin:.6em 0; }
.mdprev code { font:13px ui-monospace, Menlo, monospace; background:var(--band); padding:1px 4px; border-radius:3px; }
.mdprev pre code { display:block; padding:8px 10px; overflow:auto; }
.mdprev img { max-width:100%; }
.mdwrap[data-view="write"] .mdprev, .mdwrap[data-view="preview"] textarea.md { display:none; }
.mdwrap[data-view="preview"] .mdprev { border-left:0; }
.mdwrap.adjwrap, .mdwrap.adjwrap textarea.md { background:color-mix(in srgb, var(--select) 7%, var(--card)); }
.panel.editor.full .mdwrap { border-color:transparent; }
.panel.editor .foot { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
.panel.editor .foot .help { margin:0; flex:1; }
.panel.editor .foot button { border:1px solid var(--edge); background:transparent; border-radius:4px; padding:5px 9px; cursor:pointer; font-size:13px; }

/* conflicts */
.panel.conflictp { width:min(1000px, calc(100% - 24px)); }
.conflictp .cols { display:flex; gap:12px; margin-top:6px; }
.conflictp .cols > div { flex:1; min-width:0; }
.conflictp pre { margin:0; white-space:pre-wrap; word-break:break-word; max-height:240px; overflow:auto; border:1px solid var(--edge); border-radius:4px; padding:8px 10px; background:var(--card); font:12.5px/1.45 ui-monospace, Menlo, monospace; }
.conflictp pre mark { background:color-mix(in srgb, var(--select) 35%, transparent); color:inherit; }
.conflictp textarea { min-height:240px; font:12.5px/1.5 ui-monospace, Menlo, monospace; }
@media (max-width:700px) { .conflictp .cols { flex-direction:column; } }

/* the opening screen */
#gate { position:fixed; inset:0; z-index:40; display:flex; align-items:center; justify-content:center; background:var(--board); overflow:auto; padding:16px; box-sizing:border-box; }
#gate .card2 { max-width:520px; width:100%; padding:28px 30px; background:var(--panel); border:1px solid var(--edge); border-radius:8px; box-shadow:0 4px 20px rgba(0,0,0,.08); box-sizing:border-box; }
#gate h1 { margin:0 0 6px; font:600 32px/1.1 var(--display); color:var(--accent); }
#gate p { color:var(--ink-soft); line-height:1.55; margin:10px 0; }
#gate .go { margin:10px 8px 0 0; padding:9px 16px; border-radius:5px; border:0; background:var(--accent); color:var(--panel); cursor:pointer; font-weight:600; }
#gate .go.secondary { background:transparent; color:var(--accent); border:1px solid var(--accent); }
#gate .err { color:var(--danger); }
#gate input.pname { width:100%; box-sizing:border-box; font:600 18px var(--display); padding:8px 10px; border:1px solid var(--edge); border-radius:5px; background:var(--card); margin:6px 0 4px; }
#gate label.small { display:block; font:600 11px var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); margin-top:14px; }
#gate .recent { margin:16px 0 0; padding:0; list-style:none; border-top:1px solid var(--edge); }
#gate .recent li button { width:100%; text-align:left; display:flex; justify-content:space-between; gap:10px; border:0; border-bottom:1px solid var(--edge); background:transparent; padding:9px 4px; cursor:pointer; color:var(--ink); font-size:14px; }
#gate .recent li button:hover { background:var(--band); }
#gate .recent li small { color:var(--ink-soft); }
#gate .check { display:flex; gap:8px; align-items:flex-start; font-size:13px; color:var(--ink-soft); margin-top:12px; }
#gate .check input { margin-top:3px; }
.tpls { display:grid; grid-template-columns:repeat(auto-fit, minmax(200px, 1fr)); gap:10px; margin:14px 0 4px; }
.tpl { text-align:left; border:1px solid var(--edge); background:var(--card); border-radius:6px; padding:12px 14px; cursor:pointer; color:var(--ink); }
.tpl:hover { border-color:var(--accent); }
.tpl.on { border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
.tpl b { display:block; font:600 16px var(--display); margin-bottom:4px; }
@media (max-width:700px) { #bar .logo { display:none; } #rowhdr { width:96px; } #rowhdr .rl { font-size:12px; left:8px; } #legend { left:12px; } #bar .name { display:none; } }
.tpl span { display:block; font-size:12px; color:var(--ink-soft); line-height:1.45; }
/* figures on cards */
.card img.thumb { flex:1; min-height:0; width:100%; object-fit:contain; background:#fff; border-radius:2px; border:1px solid var(--edge); box-sizing:border-box; pointer-events:none; }
#world[data-zoom="far"] .card.hasimg h3 { -webkit-line-clamp:1; font-size:calc(11px * var(--ts, 1) * var(--zf, 1)); }
#world[data-zoom="far"] .card.hasimg .ci { justify-content:flex-start; gap:3px; }
.tab.staletab { background:var(--danger); color:#fff; }
/* dependencies */
.deps { margin-top:12px; display:flex; flex-direction:column; gap:5px; font-size:12.5px; }
.deprow { display:flex; flex-wrap:wrap; gap:5px; align-items:center; }
.deph { font:600 11px var(--ui); letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft); min-width:92px; }
.deprow .none { color:var(--ink-soft); font-style:italic; }
.dep { display:inline-flex; align-items:center; border:1px solid var(--edge); border-radius:12px; background:var(--card); overflow:hidden; }
.dep button { border:0; background:transparent; cursor:pointer; padding:2px 8px; font-size:12.5px; display:inline-flex; gap:5px; align-items:center; }
.dep button svg { width:13px; height:13px; }
.dep .dep-open:hover { color:var(--accent); }
.dep .dep-x { padding:2px 7px 2px 2px; color:var(--ink-soft); }
.dep .dep-x:hover { color:var(--danger); }
.deprow select { border:1px dashed var(--edge); background:transparent; border-radius:12px; padding:2px 6px; font-size:12px; color:var(--ink-soft); max-width:180px; }
/* the type tab */
.etabs button.ttab { color:var(--accent); }
.tpane { border:1px solid var(--edge); border-top:0; border-radius:0 0 4px 4px; background:var(--card); padding:14px 16px; overflow:auto; flex:1; min-height:200px; }
.tfields { display:grid; grid-template-columns:1fr 1fr; gap:4px 12px; }
.tfields .tf { min-width:0; }
.tfields .tf label { margin-top:8px; }
.tfields .tf:has([data-field="Caption"]), .tfields .tf:has([data-field="Hypothesis"]), .tfields .tf:has([data-field="Run"]), .tfields .tf:has([data-field="Question"]), .tfields .tf:has([data-field="Data"]) { grid-column:1 / -1; }
.tf.withbtn { position:relative; }
.tf.withbtn input { padding-right:62px; }
.tf.withbtn .mini { position:absolute; right:4px; bottom:4px; padding:3px 8px !important; }
input.mono, .codeview, textarea.code, .keychip, .warn code, .help code { font-family:ui-monospace, "SF Mono", Menlo, monospace; }
input.mono { font-size:12.5px; }
.figview { background:#fff; border:1px solid var(--edge); border-radius:4px; padding:8px; text-align:center; margin-bottom:10px; }
.figview img { max-width:100%; max-height:46vh; object-fit:contain; display:block; margin:0 auto; }
.panel.editor:not(.half):not(.full) .figview img { max-height:220px; }
.figview .cap { font-size:12px; color:#5b6a6e; margin-top:6px; text-align:left; }
.figview .empty { color:#5b6a6e; font-size:13px; padding:28px 10px; }
.figview .tscroll { overflow:auto; max-height:40vh; }
.figview table { border-collapse:collapse; font-size:12.5px; color:#1d2a2e; margin:0 auto; }
.figview th, .figview td { border:1px solid #cbd4d2; padding:3px 8px; text-align:left; white-space:nowrap; }
.figview th { background:#eef1f0; }
.tableview .mdprev { text-align:left; color:#1d2a2e; border:0; }
.warn { border:1px solid var(--danger); background:color-mix(in srgb, var(--danger) 8%, var(--card)); color:var(--ink); border-radius:4px; padding:6px 10px; margin:0 0 10px; font-size:13px; }
.warn p { margin:4px 0; }
.warn b { color:var(--danger); }
.codeview { margin:0; white-space:pre; overflow:auto; max-height:260px; border:1px solid var(--edge); border-radius:4px; padding:8px 10px; background:var(--board); font-size:12px; line-height:1.45; }
.tpane h4 { margin:16px 0 6px; font:600 14px var(--display); }
.runlist { display:flex; flex-wrap:wrap; gap:5px; margin-bottom:8px; }
.runlist button { border:1px solid var(--edge); background:transparent; border-radius:4px; padding:3px 8px; cursor:pointer; font:12px ui-monospace, Menlo, monospace; }
.runlist button.on { border-color:var(--changed); }
.runlist button.sel { background:var(--accent); color:var(--panel); border-color:var(--accent); }
.runimgs { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0; }
.runimgs img { max-width:180px; max-height:130px; background:#fff; border:1px solid var(--edge); border-radius:3px; object-fit:contain; }
.keychip { display:inline-block; border:1px solid var(--edge); border-radius:3px; padding:1px 6px; font-size:12px; margin:2px 2px 2px 0; background:var(--board); }
.imgmissing { display:inline-block; border:1px dashed var(--danger); color:var(--danger); font:12px var(--ui); padding:4px 8px; border-radius:3px; }
.mdprev img { max-width:100%; background:#fff; border-radius:3px; }
/* the Code tab */
.codebar { display:flex; gap:8px; align-items:center; padding:6px; border:1px solid var(--edge); border-top:0; background:var(--card); }
.codebar select { border:1px solid var(--edge); background:var(--board); border-radius:4px; padding:4px 6px; font:12.5px ui-monospace, Menlo, monospace; max-width:70%; }
.codebar .grow { flex:1; }
.cstatus { font-size:12px; color:var(--ink-soft); white-space:nowrap; }
.mdwrap.codewrap { border-top:0; }
.panel textarea.code { flex:1; min-width:0; border:0; border-radius:0; min-height:0; height:auto; resize:none; padding:12px 14px; font-size:13px; line-height:1.55; tab-size:4; white-space:pre; overflow:auto; background:var(--card); }
.panel textarea.code:focus-visible { outline:none; }
.codewrap.flashc { animation:flashc 1.6s ease-out 1; }
@keyframes flashc { 0% { box-shadow:inset 0 0 0 3px var(--changed); } 100% { box-shadow:none; } }
#c-help { margin-top:6px; }
/* the Overleaf panel */
.panel.olp { width:min(520px, calc(100% - 24px)); }
.panel .incl { font-size:13px; color:var(--ink-soft); display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.panel .incl label { display:inline-flex; gap:4px; align-items:center; margin:0; font:inherit; text-transform:none; letter-spacing:0; color:inherit; }
.olbox { margin:6px 0 4px; padding:8px 10px; border:1px solid var(--edge); border-radius:4px; background:var(--card); font-size:13px; }
.olbox .help { margin:0 0 0 4px; display:inline; }
.olbox .mini { margin-left:6px; }
.olsteps { margin:8px 0 4px; padding-left:20px; font-size:13px; line-height:1.5; }
.olsteps code { background:var(--board); padding:0 4px; border-radius:3px; }
.olsteps .cmdrow { display:flex; gap:6px; align-items:center; margin:6px 0; }
.olsteps .cmdrow code { flex:1; padding:5px 8px; font-size:12px; user-select:all; overflow-x:auto; white-space:nowrap; }
.olsteps li { margin-bottom:6px; }
.srcnote { font-size:11.5px; color:var(--ink-soft); margin-top:16px; }
.srcnote a { color:inherit; }
</style>
</head>
